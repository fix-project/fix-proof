name: Validate Rocq proofs

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rocq:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.3"
      - name: Install WAT compiler
        run: sudo apt-get update && sudo apt-get install -y wabt
      - name: Install pinned WasmCert-Coq and Rocq dependencies
        run: |
          opam pin add -yn coq-wasm wasm-proofs/WasmCert-Coq
          opam install . --deps-only -y
      - name: Restore kernel-check cache
        uses: actions/cache@v4
        with:
          path: wasm-proofs/rocq/.rocq-check-cache
          key: ${{ runner.os }}-rocq-check-v1-${{ hashFiles('fix-proof.opam', 'scripts/check-rocq.py', 'wasm-proofs/rocq/_CoqProject', 'wasm-proofs/rocq/*.v', 'wasm-proofs/WasmCert-Coq/**/*.v') }}
          restore-keys: |
            ${{ runner.os }}-rocq-check-v1-
      - name: Compile and check the Rocq modules
        run: opam exec -- make -j2 check CHECK_JOBS=2
